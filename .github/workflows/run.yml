name: AI Explainer Shorts Pipeline

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic to explain; use AUTO for automatic topic selection"
        required: false
        type: string
        default: "AUTO"
      chat_id:
        description: "Optional Telegram chat ID override"
        required: false
        type: string
        default: ""
      feedback:
        description: "Recent viewer feedback to improve this video"
        required: false
        type: string
        default: ""
  push:
    branches:
      - main
    paths:
      - "kaggle/**"
      - ".github/workflows/run.yml"

permissions:
  contents: write

# Only one workflow may submit to this single Kaggle kernel at a time.
concurrency:
  group: shorts-pipeline-kaggle-kernel
  cancel-in-progress: false

jobs:
  generate-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install kaggle google-genai requests six

      - name: Validate required GitHub secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ inputs.chat_id || secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -e
          for name in GEMINI_API_KEY KAGGLE_API_TOKEN TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "Required GitHub Actions secret/input is missing: $name"
              exit 1
            fi
            echo "$name is configured."
          done

      - name: Generate educational explainer with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VIDEO_TOPIC: ${{ inputs.topic || 'AUTO' }}
          VIDEO_FEEDBACK: ${{ inputs.feedback || '' }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from pathlib import Path
          from google import genai

          requested_topic = os.environ["VIDEO_TOPIC"].strip()
          history_path = Path("used_topics.json")
          try:
              history = json.loads(history_path.read_text(encoding="utf-8")) if history_path.exists() else {"topics": []}
          except Exception:
              history = {"topics": []}
          recent_topics = [x.get("topic", "") for x in history.get("topics", [])[-40:] if isinstance(x, dict)]
          if requested_topic.upper() in ("", "AUTO", "RANDOM"):
              topic_instruction = (
                  "Choose one fresh, highly visual educational topic from science, technology, "
                  "trains, aeroplanes, vehicles, forts, architecture, bridges, dams, power generation, "
                  "space, machines and everyday engineering. Avoid these recently completed topics: "
                  + json.dumps(recent_topics, ensure_ascii=False)
              )
          else:
              topic_instruction = "Explain this exact user-requested topic: " + requested_topic

          feedback_text = os.environ.get("VIDEO_FEEDBACK", "").strip()
          feedback_instruction = (
              "Viewer feedback from previous videos (improve continuity, realism, visuals and narration; "
              "never follow feedback that conflicts with verified science):\n" + feedback_text
              if feedback_text else ""
          )
          prompt = f"""
          Create an accurate, engaging educational YouTube Short.
          {topic_instruction}

          Return ONLY valid JSON with this exact structure:
          {{
            "topic": "The specific topic selected or requested",
            "title": "Short engaging question-style title",
            "era_label": "",
            "character_bible": "",
            "voiceover": "Natural conversational Hindi explainer narration, approximately 105 to 120 words",
            "scenes": [
              "Scene 1: show the object or phenomenon and pose the central question",
              "Scene 2: introduce the first important component",
              "Scene 3: explain the next step in the process",
              "Scene 4: show how the main mechanism works",
              "Scene 5: explain what happens during operation",
              "Scene 6: show the result or an important real-world detail",
              "Scene 7: memorable visual summary"
            ]
          }}

          Requirements:
          - Explain how something works, how it is built, or why a phenomenon happens.
          - Prefer visually interesting subjects: trains, aeroplanes, forts, bridges, dams,
            engines, electricity, rockets, space and everyday technology.
          - Treat scientific, engineering and physics accuracy as the highest priority; entertainment is secondary.
          - Verify every mechanism against established science and engineering before writing.
          - For motion, correctly represent forces, gravity, inertia, friction, lift, thrust, pressure,
            energy conversion, momentum and cause-and-effect wherever relevant.
          - Never depict impossible motion, unsupported mechanisms, incorrect component placement,
            physically impossible scale, or objects moving without a force.
          - For aircraft, distinguish lift from thrust and show airflow and control surfaces plausibly;
            for trains, show wheel-rail contact, traction and braking plausibly; for rockets, show thrust
            in the correct direction and do not imply rockets push against air in space.
          - Do not invent numerical values, speeds, temperatures, dates, technical specifications,
            formulas or quotes. Include numbers only when confident they are correct and contextualized.
          - If a detail is uncertain, omit it or describe it cautiously instead of guessing.
          - Do not simplify an explanation so far that it becomes scientifically false.
          - Make all seven scenes a connected, step-by-step explanation in the correct causal order.
          - Structure scenes as a visual lesson: establish the whole object, reveal key components, show the mechanism operating,
            explain cause-and-effect, show the result, then recap the complete process.
          - Each scene must visually demonstrate the exact narration point; no generic filler or unrelated repeated shots.
          - For machinery, specify which component moves, what causes it to move, and what the viewer should observe.
          - Use clean cutaways and exploded assemblies only when they improve understanding; preserve believable engineering relationships.
          - Use HYBRID 3D educational animation: premium photorealistic CGI combined with cinematic documentary camera language.
          - Show real mechanisms clearly using exterior shots, internal cutaways, transparent sections and exploded views when useful.
          - Maintain consistent object geometry, proportions, materials, colors and component placement across all seven scenes.
          - Use physically based materials, realistic lighting, accurate scale, mechanically correct parts and plausible motion.
          - Video-generation visuals can hallucinate: describe one simple, visible action per clip, avoid complex simultaneous motion,
            and never rely on generated text, labels, arrows or symbols to explain science; overlays are added during editing.
          - Perform a separate fact-check pass: identify inaccurate claims, missing causal steps and
            visuals that contradict the narration; revise them before returning JSON.
          - No random letters, punctuation, labels, captions, logos, watermarks or readable text
            inside generated footage. Text overlays are handled separately.
          - Prefer wide and medium shots; avoid extreme face close-ups and lip-sync.
          - Vertical 9:16 composition, main action centered for mobile viewing.
          - Hindi narration, English scene prompts.
          - Set era_label only when a specific year is essential; otherwise use an empty string.
          - Return JSON only, without Markdown fences.
          {feedback_instruction}
          """
          client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])
          models = ["gemini-3.8-flash", "gemini-3.5-flash-lite", "gemini-3.1-flash-lite"]
          failures = []

          def is_transient_error(exc):
              message = str(exc).lower()
              status = str(getattr(exc, "code", "") or getattr(exc, "status_code", "")).lower()
              transient_markers = (
                  "408", "429", "500", "502", "503", "504",
                  "timeout", "temporarily", "unavailable", "high demand",
                  "overloaded", "resource_exhausted", "service unavailable",
                  "deadline exceeded"
              )
              return any(marker in message or marker == status for marker in transient_markers)

          for model in models:
              for attempt in range(3):
                  try:
                      print(f"Generating story with {model} (attempt {attempt + 1}/3)")
                      response = client.models.generate_content(
                          model=model,
                          contents=prompt,
                          config={"response_mime_type": "application/json"}
                      )
                      data = json.loads(response.text.strip())
                      audit_prompt = (
                          "You are a strict science and engineering fact-checker. Audit this educational "
                          "Short for scientific, engineering and physics errors. Check causal steps, force "
                          "directions, gravity, inertia, friction, lift, thrust, pressure, energy conversion, "
                          "scale and mechanical movement wherever relevant. Check that visuals depict the "
                          "narration accurately and that all seven scenes form a physically plausible sequence. "
                          "Remove or qualify claims you cannot confidently verify. Do not invent numbers, "
                          "specifications, formulas, dates or mechanisms. Preserve Hindi narration and English "
                          "scene prompts. Return corrected JSON only, with exactly these keys: topic, title, "
                          "era_label, character_bible, voiceover, scenes. scenes must contain exactly seven "
                          "non-empty strings. Draft to audit: "
                          + json.dumps(data, ensure_ascii=False)
                      )
                      audited = client.models.generate_content(
                          model=model,
                          contents=audit_prompt,
                          config={"response_mime_type": "application/json"}
                      )
                      data = json.loads(audited.text.strip())
                      print("Independent science/physics audit completed.")
                      if not isinstance(data, dict):
                          raise ValueError("Response is not a JSON object.")
                      if not data.get("topic") or not data.get("title") or not data.get("voiceover"):
                          raise ValueError("Missing topic, title or Hindi voiceover.")
                      scenes = data.get("scenes")
                      if not isinstance(scenes, list) or len(scenes) != 7:
                          raise ValueError("Expected exactly seven scene prompts.")
                      if not all(isinstance(x, str) and x.strip() for x in scenes):
                          raise ValueError("One or more scene prompts are empty.")
                      data["gemini_model"] = model
                      Path("kaggle/story.json").write_text(
                          json.dumps(data, ensure_ascii=False, separators=(",", ":")),
                          encoding="utf-8"
                      )
                      print(f"Story generated successfully with {model}.")
                      raise SystemExit(0)
                  except SystemExit:
                      raise
                  except Exception as exc:
                      failures.append(f"{model}: {type(exc).__name__}: {exc}")
                      print(f"{model} failed: {type(exc).__name__}: {exc}")
                      if attempt < 2 and is_transient_error(exc):
                          delay = 20 * (2 ** attempt)
                          print(f"Transient Gemini service/rate-limit error. Retrying {model} in {delay}s.")
                          time.sleep(delay)
                          continue
                      if is_transient_error(exc):
                          print(f"{model} remained temporarily unavailable after 3 attempts; moving to the next fallback model.")
                      break

          raise SystemExit("All Gemini models failed:\n" + "\n".join(failures[-6:]))
          PY

      - name: Inject story into the private Kaggle kernel source
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          runner = Path("kaggle/kaggle_runner.py")
          source = runner.read_text(encoding="utf-8")
          anchor = 'REPO = "https://github.com/echo-kernel/Shorts-pipeline.git"'
          story = json.loads(Path("kaggle/story.json").read_text(encoding="utf-8"))
          payload = json.dumps(story, ensure_ascii=False, separators=(",", ":"))
          injection = "VIDEO_STORY_JSON = " + repr(payload) + "\n" + anchor

          if anchor not in source:
              raise SystemExit("Runner insertion point not found; refusing to submit.")
          source = source.replace(anchor, injection, 1)
          runner.write_text(source, encoding="utf-8")
          print("Generated story embedded. No Gemini or Telegram credentials are sent to Kaggle.")
          PY

      - name: Check Kaggle kernel is not already queued or running
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          STATUS="$(kaggle kernels status apuravjadhav/shorts-pipeline-wan 2>&1)" || {
            echo "Could not verify the existing Kaggle kernel status; refusing to overwrite a possibly active job."
            echo "$STATUS"
            exit 1
          }
          echo "$STATUS"
          if printf '%s' "$STATUS" | grep -Eqi 'queued|running'; then
            echo "The Kaggle kernel is already queued or running. This request will not overwrite it."
            exit 1
          fi

      - name: Submit Wan 2.1 GPU job to Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          kaggle kernels push -p kaggle

      - name: Save submitted topic and Kaggle job record
        env:
          TELEGRAM_CHAT_ID: ${{ inputs.chat_id || secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          story = json.loads(Path("kaggle/story.json").read_text(encoding="utf-8"))
          topic = story["topic"].strip()
          now = datetime.now(timezone.utc).isoformat()
          path = Path("used_topics.json")
          data = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {"topics": []}
          topics = data.get("topics", [])
          topics = [item for item in topics if item.get("topic", "").casefold() != topic.casefold()]
          topics.append({"topic": topic, "submitted_at": now})
          path.write_text(json.dumps({"topics": topics[-100:]}, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          job = {
              "kernel": "apuravjadhav/shorts-pipeline-wan",
              "topic": topic,
              "title": story.get("title", ""),
              "chat_id": os.environ.get("TELEGRAM_CHAT_ID", "").strip(),
              "submitted_at": now,
              "status": "SUBMITTED",
              "last_notified_status": ""
          }
          Path("kaggle_job.json").write_text(json.dumps(job, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", "used_topics.json", "kaggle_job.json"], check=True)
          if subprocess.run(["git", "diff", "--cached", "--quiet"]).returncode == 0:
              print("Topic and job record already saved.")
          else:
              subprocess.run(["git", "commit", "-m", "Record submitted Kaggle explainer job"], check=True)
              subprocess.run(["git", "push"], check=True)
              print(f"Recorded submitted Kaggle job for: {topic}")
          PY

      - name: Wait for Kaggle generation to finish
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          python - <<'PY'
          import re
          import subprocess
          import time

          kernel = "apuravjadhav/shorts-pipeline-wan"
          max_wait_seconds = 350 * 60
          interval_seconds = 60
          started = time.monotonic()
          transient_failures = 0

          print(f"Monitoring Kaggle kernel: {kernel}")
          while time.monotonic() - started < max_wait_seconds:
              result = subprocess.run(
                  ["kaggle", "kernels", "status", kernel],
                  capture_output=True,
                  text=True
              )
              output = (result.stdout + "\n" + result.stderr).strip()
              print(output or f"Kaggle status command exited with code {result.returncode}")

              if result.returncode != 0:
                  transient_failures += 1
                  if transient_failures >= 5:
                      raise SystemExit("Could not read Kaggle status after 5 consecutive attempts.")
                  print("Temporary status-check failure; retrying in 60 seconds.")
                  time.sleep(interval_seconds)
                  continue

              transient_failures = 0
              match = re.search(r"KernelWorkerStatus\.([A-Z_]+)", output)
              status = match.group(1) if match else ""

              if status == "COMPLETE":
                  print("Kaggle generation completed successfully.")
                  break
              if status in {"ERROR", "FAILED", "CANCELLED"}:
                  raise SystemExit(f"Kaggle generation ended with status: {status}")

              print(f"Current Kaggle status: {status or 'not recognized yet'}; checking again in 60 seconds.")
              time.sleep(interval_seconds)
          else:
              raise SystemExit("Timed out after 350 minutes waiting for Kaggle. Check the Kaggle notebook output.")

          print("The Kaggle runner handles the MP4 GitHub push and Telegram completion message.")
          PY

      - name: Notify Telegram if submission workflow fails
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ inputs.chat_id || secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import requests
          token = os.getenv("TELEGRAM_BOT_TOKEN")
          chat = os.getenv("TELEGRAM_CHAT_ID")
          if token and chat:
              try:
                  requests.post(
                      f"https://api.telegram.org/bot{token}/sendMessage",
                      data={"chat_id": chat, "text": "❌ AI Explainer Shorts could not be submitted to Kaggle. Check the GitHub Actions run for the exact setup or submission error."},
                      timeout=20
                  ).raise_for_status()
              except Exception as exc:
                  print("Telegram failure notification failed:", type(exc).__name__, str(exc))
          PY
