name: AI Historical Shorts Pipeline

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Video topic or story"
        required: false
        type: string
        default: "U Tirot Sing and the Khasi resistance against British expansion in 1829"
      chat_id:
        description: "Telegram chat ID for this video"
        required: false
        type: string
        default: ""
  push:
    branches:
      - main
    paths:
      - "kaggle/**"
      - ".github/workflows/run.yml"

jobs:
  submit-to-kaggle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          pip install kaggle six

      - name: Validate Kaggle files
        run: |
          test -f kaggle/kernel-metadata.json
          test -f kaggle/kaggle_runner.py
          echo "Kaggle files found."

      - name: Validate Kaggle API token
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "KAGGLE_API_TOKEN secret is missing."
            exit 1
          fi
          echo "Kaggle API token found."

      - name: Inject this request into the Kaggle runner
        if: github.event_name == 'workflow_dispatch'
        env:
          VIDEO_TOPIC: ${{ inputs.topic }}
          VIDEO_CHAT_ID: ${{ inputs.chat_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("kaggle/kaggle_runner.py")
          source = path.read_text(encoding="utf-8")
          anchor = 'REPO = "https://github.com/stonecrusher1india/Shorts-pipeline.git"'
          injected = (
              "os.environ['VIDEO_TOPIC'] = " + repr(os.getenv("VIDEO_TOPIC", "")) + "\n"
              "os.environ['VIDEO_CHAT_ID'] = " + repr(os.getenv("VIDEO_CHAT_ID", "")) + "\n"
              + anchor
          )
          if anchor not in source:
              raise SystemExit("Could not find runner insertion point")
          path.write_text(source.replace(anchor, injected, 1), encoding="utf-8")
          PY

      - name: Submit kernel to Kaggle
        id: submit
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          kaggle kernels push -p kaggle

      - name: Send Telegram notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUBMIT_STATUS: ${{ steps.submit.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PY'
          import os
          import urllib.parse
          import urllib.request

          token = os.getenv("TELEGRAM_BOT_TOKEN")
          chat_id = os.getenv("TELEGRAM_CHAT_ID")

          if not token or not chat_id:
              print("Telegram secrets are missing. Notification skipped.")
              raise SystemExit(0)

          submit_status = os.getenv("SUBMIT_STATUS", "unknown")
          job_status = os.getenv("JOB_STATUS", "unknown")

          if submit_status == "success" and job_status == "success":
              message = (
                  "✅ KAGGLE SUBMISSION SUCCESS\n\n"
                  "The AI Historical Shorts kernel was submitted.\n"
                  "This does NOT yet confirm video generation is complete.\n\n"
                  "Check the Kaggle kernel:\n"
                  "https://www.kaggle.com/code/apuravjadhav/shorts-pipeline-wan"
              )
          else:
              message = (
                  "❌ KAGGLE PIPELINE SUBMISSION FAILED\n\n"
                  f"Submit step: {submit_status}\n"
                  f"Workflow status: {job_status}\n\n"
                  "Check GitHub Actions logs:\n"
                  "https://github.com/stonecrusher1india/Shorts-pipeline/actions"
              )

          url = f"https://api.telegram.org/bot{token}/sendMessage"
          data = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": message
          }).encode()

          request = urllib.request.Request(url, data=data)

          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  print("Telegram notification sent.")
                  print(response.read().decode())
          except Exception as error:
              print(f"Telegram notification failed: {error}")
              raise
          PY
