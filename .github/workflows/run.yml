
name: AI Historical Shorts Pipeline

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  generate:
    name: Generate AI Video
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Check project files
        run: |
          pwd
          ls -la
          python -c "import os; files=['requirements.txt','generate.py','ai_video.py']; missing=[f for f in files if not os.path.isfile(f)]; print('Missing files:', missing); assert not missing, 'Required project file missing'"

      - name: Install FFmpeg
        run: |
          sudo apt-get update 2>&1 | tee -a generation.log
          sudo apt-get install -y ffmpeg 2>&1 | tee -a generation.log
          ffmpeg -version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip 2>&1 | tee -a generation.log
          pip install -r requirements.txt 2>&1 | tee -a generation.log

      - name: Generate historical AI video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -o pipefail
          python -u generate.py 2>&1 | tee -a generation.log

      - name: Upload generated video
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: generated-historical-short
          path: |
            *.mp4
            output/
          if-no-files-found: warn
          retention-days: 3

      - name: Save diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generation-diagnostic-log
          path: generation.log
          if-no-files-found: ignore
          retention-days: 3

  telegram-notification:
    name: Telegram Notification
    needs: generate
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Download diagnostic log
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: generation-diagnostic-log
          path: diagnostic

      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_RESULT: ${{ needs.generate.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python notify.py
        
