name: AI Explainer Shorts Pipeline

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic to explain; use AUTO for automatic topic selection"
        required: false
        type: string
        default: "AUTO"
      chat_id:
        description: "Optional Telegram chat ID override"
        required: false
        type: string
        default: ""
  push:
    branches:
      - main
    paths:
      - "kaggle/**"
      - ".github/workflows/run.yml"

permissions:
  contents: write

# Only one workflow may submit to this single Kaggle kernel at a time.
concurrency:
  group: shorts-pipeline-kaggle-kernel
  cancel-in-progress: false

jobs:
  generate-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install kaggle google-genai requests six

      - name: Validate required GitHub secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ inputs.chat_id || secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -e
          for name in GEMINI_API_KEY KAGGLE_API_TOKEN TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "Required GitHub Actions secret/input is missing: $name"
              exit 1
            fi
            echo "$name is configured."
          done

      - name: Generate educational explainer with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VIDEO_TOPIC: ${{ inputs.topic || 'AUTO' }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from pathlib import Path
          from google import genai

          requested_topic = os.environ["VIDEO_TOPIC"].strip()
          history_path = Path("used_topics.json")
          try:
              history = json.loads(history_path.read_text(encoding="utf-8")) if history_path.exists() else {"topics": []}
          except Exception:
              history = {"topics": []}
          recent_topics = [x.get("topic", "") for x in history.get("topics", [])[-40:] if isinstance(x, dict)]
          if requested_topic.upper() in ("", "AUTO", "RANDOM"):
              topic_instruction = (
                  "Choose one fresh, highly visual educational topic from science, technology, "
                  "trains, aeroplanes, vehicles, forts, architecture, bridges, dams, power generation, "
                  "space, machines and everyday engineering. Avoid these recently completed topics: "
                  + json.dumps(recent_topics, ensure_ascii=False)
              )
          else:
              topic_instruction = "Explain this exact user-requested topic: " + requested_topic

          prompt = f"""
          Create an accurate, engaging educational YouTube Short.
          {topic_instruction}

          Return ONLY valid JSON with this exact structure:
          {{
            "topic": "The specific topic selected or requested",
            "title": "Short engaging question-style title",
            "era_label": "",
            "character_bible": "",
            "voiceover": "Natural conversational Hindi explainer narration, approximately 105 to 120 words",
            "scenes": [
              "Scene 1: show the object or phenomenon and pose the central question",
              "Scene 2: introduce the first important component",
              "Scene 3: explain the next step in the process",
              "Scene 4: show how the main mechanism works",
              "Scene 5: explain what happens during operation",
              "Scene 6: show the result or an important real-world detail",
              "Scene 7: memorable visual summary"
            ]
          }}

          Requirements:
          - Explain how something works, how it is built, or why a phenomenon happens.
          - Prefer visually interesting subjects: trains, aeroplanes, forts, bridges, dams,
            engines, electricity, rockets, space and everyday technology.
          - Keep facts, science, engineering and historical details accurate; never invent them.
          - Make all seven scenes a connected, step-by-step explanation in the correct order.
          - Each scene must visually demonstrate the exact narration point; no generic filler.
          - Use photorealistic live-action documentary visuals, NOT 3D animation, CGI or cartoon.
          - Maintain one consistent visual style, natural lighting, film texture and color grade.
          - Use realistic materials, scale, physics, movement and engineering details.
          - No random letters, punctuation, labels, captions, logos, watermarks or readable text
            inside generated footage. Text overlays are handled separately.
          - Prefer wide and medium shots; avoid extreme face close-ups and lip-sync.
          - Vertical 9:16 composition, main action centered for mobile viewing.
          - Hindi narration, English scene prompts.
          - Set era_label only when a specific year is essential; otherwise use an empty string.
          - Return JSON only, without Markdown fences.
          """
          client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])
          models = ["gemini-3.8-flash", "gemini-3.5-flash-lite", "gemini-3.1-flash-lite"]
          failures = []

          for model in models:
              for attempt in range(2):
                  try:
                      print(f"Generating story with {model} (attempt {attempt + 1}/2)")
                      response = client.models.generate_content(
                          model=model,
                          contents=prompt,
                          config={"response_mime_type": "application/json"}
                      )
                      data = json.loads(response.text.strip())
                      if not isinstance(data, dict):
                          raise ValueError("Response is not a JSON object.")
                      if not data.get("topic") or not data.get("title") or not data.get("voiceover"):
                          raise ValueError("Missing topic, title or Hindi voiceover.")
                      scenes = data.get("scenes")
                      if not isinstance(scenes, list) or len(scenes) != 7:
                          raise ValueError("Expected exactly seven scene prompts.")
                      if not all(isinstance(x, str) and x.strip() for x in scenes):
                          raise ValueError("One or more scene prompts are empty.")
                      data["gemini_model"] = model
                      Path("kaggle/story.json").write_text(
                          json.dumps(data, ensure_ascii=False, separators=(",", ":")),
                          encoding="utf-8"
                      )
                      print(f"Story generated successfully with {model}.")
                      raise SystemExit(0)
                  except SystemExit:
                      raise
                  except Exception as exc:
                      failures.append(f"{model}: {type(exc).__name__}: {exc}")
                      print(f"{model} failed: {type(exc).__name__}: {exc}")
                      if attempt == 0 and any(x in str(exc).lower() for x in ["429", "500", "502", "503", "504", "timeout", "temporarily"]):
                          time.sleep(12)
                          continue
                      break

          raise SystemExit("All Gemini models failed:\n" + "\n".join(failures[-6:]))
          PY

      - name: Inject story into the private Kaggle kernel source
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          runner = Path("kaggle/kaggle_runner.py")
          source = runner.read_text(encoding="utf-8")
          anchor = 'REPO = "https://github.com/echo-kernel/Shorts-pipeline.git"'
          story = json.loads(Path("kaggle/story.json").read_text(encoding="utf-8"))
          payload = json.dumps(story, ensure_ascii=False, separators=(",", ":"))
          injection = "VIDEO_STORY_JSON = " + repr(payload) + "\n" + anchor

          if anchor not in source:
              raise SystemExit("Runner insertion point not found; refusing to submit.")
          source = source.replace(anchor, injection, 1)
          runner.write_text(source, encoding="utf-8")
          print("Generated story embedded. No Gemini API key is sent to Kaggle.")
          PY

      - name: Submit Wan 2.1 GPU job to Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          kaggle kernels push -p kaggle

      - name: Diagnose Kaggle queue and wait for video
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ inputs.chat_id || secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import time
          import requests
          from datetime import datetime, timezone

          kernel = "apuravjadhav/shorts-pipeline-wan"
          started = time.time()
          deadline = started + 5 * 60 * 60
          last_status = None
          last_log_check = 0
          notified_thresholds = set()

          def telegram(message):
              try:
                  response = requests.post(
                      f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage",
                      data={"chat_id": os.environ["TELEGRAM_CHAT_ID"], "text": message},
                      timeout=20
                  )
                  response.raise_for_status()
                  print("Telegram diagnostic notification sent.")
              except Exception as exc:
                  print(f"Telegram notification failed: {type(exc).__name__}: {exc}")

          while time.time() < deadline:
              now = datetime.now(timezone.utc).isoformat()
              result = subprocess.run(
                  ["kaggle", "kernels", "status", kernel],
                  text=True, capture_output=True
              )
              status_text = (result.stdout + "\\n" + result.stderr).strip()
              elapsed = int(time.time() - started)
              print(f"\\n[{now}] elapsed={elapsed}s status_exit={result.returncode}")
              print(status_text or "(Kaggle returned no status text)")

              if result.returncode != 0:
                  print("DIAGNOSIS: Kaggle status API/CLI call failed; this is not evidence of a GPU queue.")
                  raise SystemExit("Could not read Kaggle kernel status.")

              normalized = status_text.lower()
              if normalized != last_status:
                  print(f"STATUS CHANGE: {last_status!r} -> {normalized!r}")
                  last_status = normalized
                  if "running" in normalized:
                      telegram("🚀 Kaggle has started running your AI Short. GPU execution is now underway.")
                  elif "queued" in normalized:
                      telegram("⏳ Kaggle accepted your notebook but it is QUEUED. Kaggle's status API does not reveal the exact internal queue reason; this usually means a worker/GPU is not yet available. I am collecting periodic diagnostics.")
              
              if "complete" in normalized:
                  print("Kaggle kernel completed.")
                  raise SystemExit(0)
              if "error" in normalized or "cancel" in normalized:
                  print("DIAGNOSIS: Kaggle reports an unsuccessful terminal state. Fetching logs in the next diagnostics step.")
                  raise SystemExit("Kaggle kernel ended unsuccessfully. Check the uploaded diagnostics artifact.")

              # Kaggle exposes status and logs, but not its internal scheduler reason.
              # Capture logs periodically so any startup/runtime failure is visible as soon as logs exist.
              if time.time() - last_log_check >= 300:
                  logs = subprocess.run(
                      ["kaggle", "kernels", "logs", kernel],
                      text=True, capture_output=True
                  )
                  log_text = (logs.stdout + "\\n" + logs.stderr).strip()
                  print("===== PERIODIC KAGGLE LOG CHECK =====")
                  if log_text:
                      print(log_text[-12000:])
                  else:
                      print("No execution log available yet. If status remains QUEUED, notebook code has probably not started.")
                  last_log_check = time.time()

              # Escalating queue alerts; these are elapsed-time warnings, not fabricated root causes.
              for minutes in (15, 30, 60, 120):
                  if elapsed >= minutes * 60 and minutes not in notified_thresholds and "queued" in normalized:
                      notified_thresholds.add(minutes)
                      note = (
                          f"⏳ Kaggle is still QUEUED after {minutes} minutes. "
                          "The Kaggle API does not expose the scheduler's exact reason. "
                          "No notebook execution logs means the code has not visibly started; "
                          "the likely issue is Kaggle worker/GPU capacity or scheduling. "
                          "See GitHub Actions logs for timestamped status and log checks."
                      )
                      print("QUEUE DIAGNOSIS: " + note)
                      telegram(note)

              time.sleep(60)

          raise SystemExit("Timed out after 5 hours waiting for Kaggle. See periodic status/log diagnostics.")
          PY

      - name: Collect Kaggle status and execution logs
        if: always()
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          mkdir -p kaggle-diagnostics
          kaggle kernels status apuravjadhav/shorts-pipeline-wan > kaggle-diagnostics/status.txt 2>&1 || true
          kaggle kernels logs apuravjadhav/shorts-pipeline-wan > kaggle-diagnostics/kernel.log 2>&1 || true
          echo "===== KAGGLE KERNEL STATUS ====="
          cat kaggle-diagnostics/status.txt
          echo "===== LAST 250 LINES OF KAGGLE LOG ====="
          if [ -s kaggle-diagnostics/kernel.log ]; then
            tail -n 250 kaggle-diagnostics/kernel.log
          else
            echo "Kaggle has not made execution logs available yet."
          fi

      - name: Upload Kaggle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-diagnostics
          path: kaggle-diagnostics/
          if-no-files-found: ignore
          retention-days: 7

      - name: Download and verify final MP4
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -e
          mkdir -p kaggle-output
          kaggle kernels output apuravjadhav/shorts-pipeline-wan -p kaggle-output -o
          python - <<'PY'
          from pathlib import Path
          videos = list(Path("kaggle-output").rglob("historical_short.mp4"))
          if not videos:
              raise SystemExit("Kaggle completed but historical_short.mp4 was not found in kernel output.")
          video = max(videos, key=lambda p: p.stat().st_size)
          if video.stat().st_size < 10000:
              raise SystemExit("Downloaded MP4 is unexpectedly small.")
          print(f"Verified MP4: {video} ({video.stat().st_size / 1024 / 1024:.2f} MB)")
          PY

      - name: Upload final MP4 to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: historical-short-mp4
          path: kaggle-output/**/historical_short.mp4
          if-no-files-found: error
          retention-days: 7

      - name: Send completed MP4 to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ inputs.chat_id || secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import requests

          videos = list(Path("kaggle-output").rglob("historical_short.mp4"))
          video = max(videos, key=lambda p: p.stat().st_size)
          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat = os.environ["TELEGRAM_CHAT_ID"]

          with video.open("rb") as handle:
              response = requests.post(
                  f"https://api.telegram.org/bot{token}/sendVideo",
                  data={
                      "chat_id": chat,
                      "caption": "🎬 Your AI historical Short is ready!"
                  },
                  files={"video": ("historical_short.mp4", handle, "video/mp4")},
                  timeout=(30, 600)
              )
          response.raise_for_status()
          result = response.json()
          if not result.get("ok"):
              raise SystemExit(f"Telegram rejected the video: {result}")
          print("Final MP4 sent to Telegram.")
          PY

      - name: Notify Telegram if the workflow fails
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ inputs.chat_id || secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.getenv("TELEGRAM_BOT_TOKEN")
          chat = os.getenv("TELEGRAM_CHAT_ID")
          if token and chat:
              requests.post(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  data={
                      "chat_id": chat,
                      "text": "❌ AI Historical Shorts failed. Check the GitHub Actions run and Kaggle kernel logs for the exact error."
                  },
                  timeout=20
              ).raise_for_status()
          PY
