
name: Submit AI Shorts to Kaggle

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Historical video topic"
        required: true
        default: "U Tirot Sing - Khasi Resistance"

permissions:
  contents: read

jobs:
  submit-kaggle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          pip install kaggle

      - name: Submit GPU notebook
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$KAGGLE_USERNAME" ] || [ -z "$KAGGLE_KEY" ]; then
            echo "Kaggle credentials are missing."
            exit 1
          fi

          if [ ! -f kaggle/kernel-metadata.json ]; then
            echo "Kaggle metadata file is missing."
            exit 1
          fi

          if [ ! -f kaggle/kaggle_runner.py ]; then
            echo "Kaggle runner file is missing."
            exit 1
          fi

          kaggle kernels push -p kaggle

          echo "Kaggle submission command completed."
          echo "https://www.kaggle.com/code/${KAGGLE_USERNAME}/shorts-pipeline-wan"
          
