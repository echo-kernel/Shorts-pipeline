
name: AI Historical Shorts Pipeline

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Initialize diagnostic log
        run: |
          mkdir -p diagnostic
          touch generation.log
          echo "Pipeline started: $(date -u)" | tee -a generation.log

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check project files
        run: |
          set -e
          for f in requirements.txt generate.py ai_video.py notify.py; do
            test -f "$f" || {
              echo "ERROR: Missing file: $f"
              exit 1
            }
            echo "OK: $f"
          done

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Gemini API key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "ERROR: GEMINI_API_KEY secret is missing."
            exit 1
          fi
          echo "Gemini API key is configured."

      - name: Generate AI video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_MODEL: gemini-3.8-flash
        run: |
          set -o pipefail
          python -u generate.py 2>&1 | tee generation.log

      - name: Upload generated video
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: generated-historical-short
          path: output/
          if-no-files-found: error
          retention-days: 3

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: generation-diagnostic-log
          path: generation.log
          if-no-files-found: warn
          retention-days: 3

  telegram:
    needs: generate
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download diagnostic log
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: generation-diagnostic-log
          path: diagnostic

      - name: Send Telegram report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          JOB_RESULT: ${{ needs.generate.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python notify.py
        
