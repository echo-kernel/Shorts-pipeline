name: AI Explainer Shorts Pipeline

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic to explain; use AUTO for automatic topic selection"
        required: false
        type: string
        default: "AUTO"
      chat_id:
        description: "Optional Telegram chat ID override"
        required: false
        type: string
        default: ""
      feedback:
        description: "Recent viewer feedback to improve this video"
        required: false
        type: string
        default: ""
      voice_id:
        description: "Kokoro Hindi narrator voice"
        required: false
        type: choice
        options:
          - hm_omega
          - hm_psi
          - hf_alpha
          - hf_beta
        default: hm_omega

permissions:
  contents: write

# Only one workflow may submit to this single Kaggle kernel at a time.
concurrency:
  group: shorts-pipeline-kaggle-kernel
  cancel-in-progress: false

jobs:
  generate-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install kaggle google-genai requests six

      - name: Validate required GitHub secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ inputs.chat_id || secrets.TELEGRAM_CHAT_ID }}
          VIDEO_GITHUB_TOKEN: ${{ secrets.VIDEO_GITHUB_TOKEN }}
        run: |
          set -e
          for name in GEMINI_API_KEY KAGGLE_API_TOKEN TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID VIDEO_GITHUB_TOKEN; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "Required GitHub Actions secret/input is missing: $name"
              exit 1
            fi
            echo "$name is configured."
          done

      - name: Allocate continuous video number
        id: video_identity
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          path = Path('video_counter.json')
          try:
              data = json.loads(path.read_text(encoding='utf-8'))
          except Exception:
              data = {'last_number': 0}
          number = int(data.get('last_number', 0)) + 1
          path.write_text(json.dumps({'last_number': number}, indent=2) + chr(10), encoding='utf-8')
          subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git','add',str(path)], check=True)
          subprocess.run(['git','commit','-m','Reserve video number ' + str(number)], check=True)
          # Rebase our counter commit if code or documentation was pushed after checkout.
          branch = os.environ.get('GITHUB_REF_NAME', 'jee-telegram-quiz')
          pushed = False
          for attempt in range(5):
              subprocess.run(['git','fetch','origin',branch], check=True)
              rebase = subprocess.run(['git','rebase','origin/' + branch])
              if rebase.returncode != 0:
                  subprocess.run(['git','rebase','--abort'])
                  raise SystemExit('Could not rebase video-number reservation onto the latest branch.')
              push = subprocess.run(['git','push'])
              if push.returncode == 0:
                  pushed = True
                  break
          if not pushed:
              raise SystemExit('Could not push video-number reservation after 5 attempts.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('number=' + str(number).zfill(4) + chr(10))
          print('Reserved Video #' + str(number).zfill(4))
          PY

      - name: Start Telegram progress message
        id: progress_start
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ inputs.chat_id || secrets.TELEGRAM_CHAT_ID }}
          VIDEO_TOPIC: ${{ inputs.topic || 'AUTO' }}
          VIDEO_NUMBER: ${{ steps.video_identity.outputs.number }}
          TRACK_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          token, chat = os.environ['TELEGRAM_BOT_TOKEN'], os.environ['TELEGRAM_CHAT_ID']
          number = os.environ['VIDEO_NUMBER']
          text = '🎬 VIDEO #' + number + '\nSection: Classifying topic…\n\n🟡 Request accepted\n⚪ Writing and checking story\n⚪ Preparing Kaggle GPU job\n⚪ Rendering scenes and Hindi narration\n⚪ Editing final video\n\nRequested topic: ' + os.environ.get('VIDEO_TOPIC', 'AUTO')[:300]
          markup = {'inline_keyboard': [[{'text': '📊 Track Video Progress', 'url': os.environ['TRACK_URL']}]]}
          payload = {'chat_id': chat, 'text': text, 'reply_markup': markup}
          req = urllib.request.Request(f'https://api.telegram.org/bot{token}/sendMessage', data=json.dumps(payload).encode(), headers={'Content-Type':'application/json'}, method='POST')
          with urllib.request.urlopen(req, timeout=20) as r: data = json.loads(r.read().decode())
          if not data.get('ok'): raise SystemExit('Could not create Telegram progress message')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out: out.write('message_id=' + str(data['result']['message_id']) + '\n')
          PY

      - name: Generate educational explainer with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VIDEO_TOPIC: ${{ inputs.topic || 'AUTO' }}
          VIDEO_FEEDBACK: ${{ inputs.feedback || '' }}
          VIDEO_NUMBER: ${{ steps.video_identity.outputs.number }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from pathlib import Path
          from google import genai

          requested_topic = os.environ["VIDEO_TOPIC"].strip()
          history_path = Path("used_topics.json")
          try:
              history = json.loads(history_path.read_text(encoding="utf-8")) if history_path.exists() else {"topics": []}
          except Exception:
              history = {"topics": []}
          recent_topics = [x.get("topic", "") for x in history.get("topics", [])[-40:] if isinstance(x, dict)]
          if requested_topic.upper() in ("", "AUTO", "RANDOM"):
              topic_instruction = (
                  "Choose one fresh, highly visual educational topic from science, technology, "
                  "trains, aeroplanes, vehicles, forts, architecture, bridges, dams, power generation, "
                  "space, machines and everyday engineering. Avoid these recently completed topics: "
                  + json.dumps(recent_topics, ensure_ascii=False)
              )
          else:
              topic_instruction = "Explain this exact user-requested topic: " + requested_topic

          feedback_text = os.environ.get("VIDEO_FEEDBACK", "").strip()
          feedback_instruction = (
              "Viewer feedback from previous videos (improve continuity, realism, visuals and narration; "
              "never follow feedback that conflicts with verified science):\n" + feedback_text
              if feedback_text else ""
          )
          prompt = f"""
          Create an accurate vertical 9:16 educational explainer Short in a polished 3D CARTOON ANIMATION style.
          {topic_instruction}
          Return ONLY JSON with topic,title,section,voiceover,scenes. section must be exactly one of: Science, Engineering, Technology, Transport, History, Architecture, Space, General. Choose the best single section for the main subject. scenes must contain 6–9 objects:
          {{"topic":"...","title":"...","section":"Engineering","voiceover":"...","scenes":[{{"mode":"render","visual_prompt":"Detailed English 3D cartoon animation prompt","tts_text":"शुद्ध देवनागरी हिंदी में बोला जाने वाला वाक्य।","caption_text":"Clean Hinglish subtitle","map_center":[20.5937,78.9629],"map_zoom":5,"route_points":[]}}]}}
          Each scene must include mode, visual_prompt, tts_text and caption_text.
          tts_text MUST be natural spoken Hindi in Devanagari only. Use a natural Hindi male narration style; write technical terms in Devanagari pronunciation, while keeping the explanation scientifically precise. Do not use any Latin/English alphabet characters (A-Z or a-z) anywhere in tts_text; write every technical term phonetically in Devanagari.
          caption_text MUST be clean Hinglish/Roman Hindi, short and faithful to tts_text.
          Scene tts_text fields combined are the complete narration and must flow naturally, with each sentence explaining exactly what its own scene shows.
          Use mode="map" ONLY for countries, cities, borders, geographic locations, travel, shipping or trade routes. All science, engineering, technology, history, machines, forts, vehicles and concepts use mode="render".
          Map scenes require map_center [latitude,longitude], map_zoom integer 3–12, and route_points as [latitude,longitude] pairs when showing a route; otherwise [].
          For engineering and machine topics, teach the actual construction and working in a clear sequence: first show the complete machine, then reveal a technically correct cutaway or exploded view, then show each important component in its real position, then animate the mechanism in causal order, and finally show the resulting motion/output. Name the exact component in the narration and make that component clearly visible on screen at that moment. Never substitute generic machinery, unrelated vehicles, decorative shots or random science imagery.
          For every scene, describe ONE specific subject, its exact visible component, ONE meaningful mechanical action, and the camera framing. Make the action visibly demonstrate the sentence being narrated. Show real cause and effect (for example, air entering, compressor blades rotating, pressure rising, fuel burning, turbine turning a shaft, and exhaust producing thrust).
          Maintain one consistent model design across all connected scenes: same shape, proportions, colors, materials, component arrangement, environment and cartoon rendering style. Reuse the same visual design description in every connected scene. Do not redesign the machine between shots.
          Visual style: premium polished 3D educational cartoon animation, appealing rounded forms but accurate engineering geometry, clean readable silhouettes, rich but controlled colors, soft studio lighting, expressive motion, smooth continuous animation and clear educational staging. This is CARTOON animation, not photorealistic CGI, live action, anime, slideshow or still-image montage.
          Use cutaway views, transparent sections or exploded parts only when they help explain real construction. Keep components physically connected and in correct positions. Airflow, fluids, heat and moving parts must be animated in the correct direction. No impossible physics.
          No generated words, labels, captions, logos or watermarks. Do not describe anything that is not visible. No filler, repeated scenes, unrelated footage or vague prompts such as "technology in action".
          Total narration about 100–125 Hindi words. Return JSON only, without Markdown fences.
          {feedback_instruction}
          """
          client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])
          models = ["gemini-3.8-flash", "gemini-3.5-flash-lite", "gemini-3.1-flash-lite"]
          failures = []

          def is_transient_error(exc):
              message = str(exc).lower()
              status = str(getattr(exc, "code", "") or getattr(exc, "status_code", "")).lower()
              transient_markers = (
                  "408", "429", "500", "502", "503", "504",
                  "timeout", "temporarily", "unavailable", "high demand",
                  "overloaded", "resource_exhausted", "service unavailable",
                  "deadline exceeded"
              )
              return any(marker in message or marker == status for marker in transient_markers)

          import re

          def parse_json_response(response_text):
              if not response_text or not response_text.strip():
                  raise ValueError("Gemini returned an empty response.")
              cleaned = response_text.strip()
              if cleaned.startswith("```"):
                  cleaned = re.sub(r"^```(?:json)?\s*", "", cleaned, flags=re.IGNORECASE)
                  cleaned = re.sub(r"\s*```$", "", cleaned)
              return json.loads(cleaned)

          def validate_story(data, label):
              if not isinstance(data, dict):
                  raise ValueError(f"{label}: response is not a JSON object.")
              if not str(data.get("topic", "")).strip() or not str(data.get("title", "")).strip():
                  raise ValueError(f"{label}: missing topic or title.")
              allowed_sections = {"Science", "Engineering", "Technology", "Transport", "History", "Architecture", "Space", "General"}
              section = str(data.get("section", "General")).strip().title()
              data["section"] = section if section in allowed_sections else "General"
              scenes = data.get("scenes")
              if not isinstance(scenes, list) or not 6 <= len(scenes) <= 9:
                  raise ValueError(f"{label}: expected 6–9 structured scene objects.")
              devanagari = re.compile(r"[\u0900-\u097F]")
              latin = re.compile(r"[A-Za-z]")
              for i, scene in enumerate(scenes, 1):
                  if not isinstance(scene, dict):
                      raise ValueError(f"{label}: scene {i} must be an object.")
                  for key in ("mode", "visual_prompt", "tts_text", "caption_text"):
                      if not isinstance(scene.get(key), str) or not scene[key].strip():
                          raise ValueError(f"{label}: scene {i} missing {key}.")
                  if scene["mode"] not in ("render", "map"):
                      raise ValueError(f"{label}: scene {i} has invalid mode.")
                  if latin.search(scene["tts_text"]) or not devanagari.search(scene["tts_text"]):
                      raise ValueError(f"{label}: scene {i} narration must be Hindi in Devanagari only.")
                  if devanagari.search(scene["caption_text"]):
                      raise ValueError(f"{label}: scene {i} caption must be Roman Hinglish.")
                  if scene["mode"] == "map":
                      center = scene.get("map_center")
                      if not isinstance(center, list) or len(center) != 2:
                          raise ValueError(f"{label}: map scene {i} requires [latitude, longitude].")
              data["voiceover"] = " ".join(scene["tts_text"].strip() for scene in scenes)
              return data

          for model in models:
              for attempt in range(3):
                  try:
                      print(f"Generating story with {model} (attempt {attempt + 1}/3)")
                      attempt_prompt = prompt
                      if attempt:
                          attempt_prompt += (
                              "\nYour previous output failed validation. Return a single valid JSON object. "
                              "Include exactly 7 scene objects. Use only Devanagari characters in every tts_text; "
                              "spell all technical terms phonetically in Hindi. caption_text must use Roman Hinglish."
                          )
                      response = client.models.generate_content(
                          model=model,
                          contents=attempt_prompt,
                          config={"response_mime_type": "application/json"}
                      )
                      draft = validate_story(
                          parse_json_response(response.text),
                          "Initial Gemini draft"
                      )
                      print(f"Initial story passed schema and language validation with {model}.")

                      # Audit is an enhancement, not a gate that can discard a valid story.
                      audit_prompt = (
                          "Review this educational script for factual and engineering accuracy, "
                          "scene-to-narration alignment, continuity and consistent polished 3D cartoon style. "
                          "Correct only genuine errors. Preserve the exact number of scenes and all required keys. "
                          "Keep every tts_text exclusively in Devanagari Hindi with no Latin letters; keep every "
                          "caption_text in Roman Hinglish. Return one valid JSON object only. Draft: "
                          + json.dumps(draft, ensure_ascii=False)
                      )
                      try:
                          audited_response = client.models.generate_content(
                              model=model,
                              contents=audit_prompt,
                              config={"response_mime_type": "application/json"}
                          )
                          audited = validate_story(
                              parse_json_response(audited_response.text),
                              "Science-audited story"
                          )
                          if len(audited["scenes"]) != len(draft["scenes"]):
                              raise ValueError("Audit changed the scene count.")
                          data = audited
                          print("Independent science/physics audit passed validation.")
                      except Exception as audit_error:
                          data = draft
                          print(
                              "Science audit output was unusable; retaining the validated original draft. "
                              f"Reason: {type(audit_error).__name__}: {audit_error}"
                          )

                      data["video_number"] = os.environ["VIDEO_NUMBER"]
                      data["gemini_model"] = model
                      Path("kaggle/story.json").write_text(
                          json.dumps(data, ensure_ascii=False, separators=(",", ":")),
                          encoding="utf-8"
                      )
                      print(f"Story generated successfully with {model}; proceeding to Kaggle.")
                      raise SystemExit(0)

                  except SystemExit:
                      raise
                  except Exception as exc:
                      failures.append(f"{model}: {type(exc).__name__}: {exc}")
                      print(f"{model} failed: {type(exc).__name__}: {exc}")
                      if attempt < 2:
                          if is_transient_error(exc):
                              delay = 20 * (2 ** attempt)
                              print(f"Transient Gemini service/rate-limit error. Retrying {model} in {delay}s.")
                          else:
                              delay = 5 * (2 ** attempt)
                              print(f"Invalid JSON/schema/language. Retrying {model} with stricter instructions in {delay}s.")
                          time.sleep(delay)
                          continue
                      print(f"{model} exhausted 3 attempts; moving to the next fallback model.")

          raise SystemExit("All configured Gemini models failed initial story validation:\n" + "\n".join(failures[-6:]))
          PY

      - name: Show assigned section and video number in Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ inputs.chat_id || secrets.TELEGRAM_CHAT_ID }}
          PROGRESS_MESSAGE_ID: ${{ steps.progress_start.outputs.message_id }}
          VIDEO_NUMBER: ${{ steps.video_identity.outputs.number }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          story = json.loads(Path('kaggle/story.json').read_text(encoding='utf-8'))
          text = '🎬 VIDEO #' + os.environ['VIDEO_NUMBER'] + ' — ' + story.get('title','AI Short') + '\nSection: ' + story.get('section','General') + '\nTopic: ' + story.get('topic','') + '\n\n✅ Request accepted\n✅ Story generated and checked\n🟡 Preparing Kaggle GPU job\n⚪ Rendering scenes and Hindi narration\n⚪ Final editing'
          req = urllib.request.Request('https://api.telegram.org/bot' + os.environ['TELEGRAM_BOT_TOKEN'] + '/editMessageText', data=json.dumps({'chat_id':os.environ['TELEGRAM_CHAT_ID'],'message_id':int(os.environ['PROGRESS_MESSAGE_ID']),'text':text}).encode(), headers={'Content-Type':'application/json'}, method='POST')
          urllib.request.urlopen(req, timeout=20).read()
          PY

      - name: Inject story and Kokoro voice into the private Kaggle kernel source
        env:
          KOKORO_VOICE_ID: ${{ inputs.voice_id || 'hm_omega' }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          runner = Path("kaggle/kaggle_runner.py")
          source = runner.read_text(encoding="utf-8")
          anchor = 'REPO = "https://github.com/echo-kernel/Shorts-pipeline.git"'
          story = json.loads(Path("kaggle/story.json").read_text(encoding="utf-8"))
          payload = json.dumps(story, ensure_ascii=False, separators=(",", ":"))
          voice_id = os.environ.get("KOKORO_VOICE_ID", "hm_omega")
          if voice_id not in {"hm_omega", "hm_psi", "hf_alpha", "hf_beta"}:
              raise SystemExit("Invalid Kokoro voice selection.")
          injection = (
              "VIDEO_STORY_JSON = " + repr(payload) + "\n"
              + "KOKORO_VOICE_ID = " + repr(voice_id) + "\n"
              + anchor
          )
          if anchor not in source:
              raise SystemExit("Runner insertion point not found; refusing to submit.")
          source = source.replace(anchor, injection, 1)
          runner.write_text(source, encoding="utf-8")
          print("Generated story and Kokoro voice embedded. No Gemini or Telegram credentials are sent to Kaggle.")
          PY

      - name: Check Kaggle kernel is not already queued or running
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          STATUS="$(kaggle kernels status apuravjadhav/shorts-pipeline-wan 2>&1)" || {
            echo "Could not verify the existing Kaggle kernel status; refusing to overwrite a possibly active job."
            echo "$STATUS"
            exit 1
          }
          echo "$STATUS"
          if printf '%s' "$STATUS" | grep -Eqi 'queued|running'; then
            echo "The Kaggle kernel is already queued or running. This request will not overwrite it."
            exit 1
          fi

      - name: Submit Wan 2.1 GPU job to Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          kaggle kernels push -p kaggle

      - name: Save submitted topic and Kaggle job record
        env:
          TELEGRAM_CHAT_ID: ${{ inputs.chat_id || secrets.TELEGRAM_CHAT_ID }}
          VIDEO_NUMBER: ${{ steps.video_identity.outputs.number }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          story = json.loads(Path("kaggle/story.json").read_text(encoding="utf-8"))
          topic = story["topic"].strip()
          now = datetime.now(timezone.utc).isoformat()
          path = Path("used_topics.json")
          data = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {"topics": []}
          topics = data.get("topics", [])
          topics = [item for item in topics if item.get("topic", "").casefold() != topic.casefold()]
          topics.append({"topic": topic, "submitted_at": now})
          path.write_text(json.dumps({"topics": topics[-100:]}, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          job = {
              "kernel": "apuravjadhav/shorts-pipeline-wan",
              "video_number": os.environ.get("VIDEO_NUMBER", ""),
              "section": story.get("section", "General"),
              "topic": topic,
              "title": story.get("title", ""),
              "chat_id": os.environ.get("TELEGRAM_CHAT_ID", "").strip(),
              "submitted_at": now,
              "status": "SUBMITTED",
              "last_notified_status": ""
          }
          Path("kaggle_job.json").write_text(json.dumps(job, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", "used_topics.json", "kaggle_job.json"], check=True)
          if subprocess.run(["git", "diff", "--cached", "--quiet"]).returncode == 0:
              print("Topic and job record already saved.")
          else:
              subprocess.run(["git", "commit", "-m", "Record submitted Kaggle explainer job"], check=True)
              branch = os.environ.get("GITHUB_REF_NAME", "jee-telegram-quiz")
              pushed = False
              for attempt in range(5):
                  subprocess.run(["git", "fetch", "origin", branch], check=True)
                  rebase = subprocess.run(["git", "rebase", "origin/" + branch])
                  if rebase.returncode != 0:
                      subprocess.run(["git", "rebase", "--abort"])
                      raise SystemExit("Could not rebase the Kaggle job record onto the latest branch.")
                  push = subprocess.run(["git", "push"])
                  if push.returncode == 0:
                      pushed = True
                      break
              if not pushed:
                  raise SystemExit("Could not push Kaggle job record after 5 attempts.")
              print(f"Recorded submitted Kaggle job for: {topic}")
          PY

      - name: Update Telegram before Kaggle monitoring
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ inputs.chat_id || secrets.TELEGRAM_CHAT_ID }}
          PROGRESS_MESSAGE_ID: ${{ steps.progress_start.outputs.message_id }}
          VIDEO_NUMBER: ${{ steps.video_identity.outputs.number }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          story=json.loads(Path('kaggle/story.json').read_text(encoding='utf-8'))
          text='🎬 VIDEO #' + os.environ['VIDEO_NUMBER'] + '\nSection: ' + story.get('section','General') + '\nTopic: ' + story.get('topic','') + '\n\n✅ Story generated and checked\n✅ Kaggle GPU job submitted\n🟡 Waiting for Kaggle GPU / rendering\n⚪ Creating scenes and Hindi narration\n⚪ Assembling subtitles and final MP4'
          req=urllib.request.Request('https://api.telegram.org/bot'+os.environ['TELEGRAM_BOT_TOKEN']+'/editMessageText',data=json.dumps({'chat_id':os.environ['TELEGRAM_CHAT_ID'],'message_id':int(os.environ['PROGRESS_MESSAGE_ID']),'text':text}).encode(),headers={'Content-Type':'application/json'},method='POST')
          urllib.request.urlopen(req,timeout=20).read()
          PY

      - name: Wait for Kaggle generation to finish
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ inputs.chat_id || secrets.TELEGRAM_CHAT_ID }}
          PROGRESS_MESSAGE_ID: ${{ steps.progress_start.outputs.message_id }}
          VIDEO_NUMBER: ${{ steps.video_identity.outputs.number }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import time
          import urllib.request

          kernel = "apuravjadhav/shorts-pipeline-wan"
          max_wait_seconds = 350 * 60
          interval_seconds = 60
          started = time.monotonic()
          transient_failures = 0

          print(f"Monitoring Kaggle kernel: {kernel}")
          token = os.environ['TELEGRAM_BOT_TOKEN']
          chat = os.environ['TELEGRAM_CHAT_ID']
          message_id = int(os.environ['PROGRESS_MESSAGE_ID'])
          video_number = os.environ['VIDEO_NUMBER']
          story = json.loads(__import__('pathlib').Path('kaggle/story.json').read_text(encoding='utf-8'))
          section, topic = story.get('section', 'General'), story.get('topic', '')
          def update_telegram(status, elapsed):
              if 'QUEUED' in status: label = 'Kaggle has queued the GPU job'
              elif 'RUNNING' in status: label = 'Kaggle GPU notebook is running; scenes and narration are processing'
              else: label = 'Kaggle status: ' + status
              message = ('🎬 VIDEO #' + video_number + '\nSection: ' + section + '\nTopic: ' + topic + '\n\n✅ Story generated and checked\n✅ Kaggle job submitted\n🟡 ' + label + '\n⚪ Final editing and MP4 recovery\n\nKaggle status: ' + status + '\nTime on Kaggle: ' + str(elapsed // 60) + ' min ' + str(elapsed % 60) + ' sec\n\nThis message refreshes automatically.')
              req = urllib.request.Request(f'https://api.telegram.org/bot{token}/editMessageText', data=json.dumps({'chat_id':chat,'message_id':message_id,'text':message}).encode(), headers={'Content-Type':'application/json'}, method='POST')
              try: urllib.request.urlopen(req, timeout=20).read()
              except Exception as exc: print('Telegram update warning:', type(exc).__name__, str(exc)[:150])
          while time.monotonic() - started < max_wait_seconds:
              result = subprocess.run(
                  ["kaggle", "kernels", "status", kernel],
                  capture_output=True,
                  text=True
              )
              output = (result.stdout + "\n" + result.stderr).strip()
              print(output or f"Kaggle status command exited with code {result.returncode}")
              if result.returncode == 0: update_telegram(output, int(time.monotonic() - started))

              if result.returncode != 0:
                  transient_failures += 1
                  if transient_failures >= 5:
                      raise SystemExit("Could not read Kaggle status after 5 consecutive attempts.")
                  print("Temporary status-check failure; retrying in 60 seconds.")
                  time.sleep(interval_seconds)
                  continue

              transient_failures = 0
              match = re.search(r"KernelWorkerStatus\.([A-Z_]+)", output)
              status = match.group(1) if match else ""

              if status == "COMPLETE":
                  print("Kaggle generation completed successfully.")
                  break
              if status in {"ERROR", "FAILED", "CANCELLED"}:
                  print(f"Kaggle ended with status {status}. Attempting output recovery before failing.")
                  logs = subprocess.run(
                      ["kaggle", "kernels", "logs", kernel],
                      capture_output=True,
                      text=True
                  )
                  print("===== KAGGLE NOTEBOOK LOGS =====")
                  print(logs.stdout or "(no stdout log returned)")
                  if logs.stderr:
                      print(logs.stderr)
                  print("===== END KAGGLE NOTEBOOK LOGS =====")
                  # Do not fail here: the notebook may have saved the MP4 before
                  # a later cleanup/upload step crashed. Continue to output download.
                  break

              print(f"Current Kaggle status: {status or 'not recognized yet'}; checking again in 60 seconds.")
              time.sleep(interval_seconds)
          else:
              raise SystemExit("Timed out after 350 minutes waiting for Kaggle. Check the Kaggle notebook output.")

          print("Attempting to download Kaggle notebook output (including after ERROR).")
          PY

      - name: Update Telegram after Kaggle finishes
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ inputs.chat_id || secrets.TELEGRAM_CHAT_ID }}
          PROGRESS_MESSAGE_ID: ${{ steps.progress_start.outputs.message_id }}
          VIDEO_NUMBER: ${{ steps.video_identity.outputs.number }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          token, chat, mid = os.environ['TELEGRAM_BOT_TOKEN'], os.environ['TELEGRAM_CHAT_ID'], int(os.environ['PROGRESS_MESSAGE_ID'])
          story=json.loads(Path('kaggle/story.json').read_text(encoding='utf-8'))
          text = '🎬 VIDEO #' + os.environ['VIDEO_NUMBER'] + '\nSection: ' + story.get('section','General') + '\nTopic: ' + story.get('topic','') + '\n\n✅ Story generated and checked\n✅ Kaggle GPU processing finished\n🟡 Downloading and validating the MP4\n⚪ Saving the finished video\n⚪ Starting YouTube upload'
          req = urllib.request.Request(f'https://api.telegram.org/bot{token}/editMessageText', data=json.dumps({'chat_id':chat,'message_id':mid,'text':text}).encode(), headers={'Content-Type':'application/json'}, method='POST')
          urllib.request.urlopen(req, timeout=20).read()
          PY

      - name: Download completed video from Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p kaggle-download
          kaggle kernels output apuravjadhav/shorts-pipeline-wan -p kaggle-download
          echo "Downloaded Kaggle output:"
          find kaggle-download -type f -printf '%p (%s bytes)\n'

      - name: Validate and add video to repository
        env:
          VIDEO_NUMBER: ${{ steps.video_identity.outputs.number }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          import shutil
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path("kaggle-download")
          candidates = [p for p in root.rglob("*.mp4") if p.is_file()]
          if not candidates:
              raise SystemExit("Kaggle output download completed, but no MP4 was found.")
          preferred = [p for p in candidates if p.name == "historical_short.mp4"]
          source = preferred[0] if preferred else max(candidates, key=lambda p: p.stat().st_size)
          size = source.stat().st_size
          if size < 10000:
              raise SystemExit(f"Downloaded MP4 is too small ({size} bytes): {source}")

          story = json.loads(Path("kaggle/story.json").read_text(encoding="utf-8"))
          topic = str(story.get("topic") or "educational-short")
          safe_topic = re.sub(r"[^A-Za-z0-9_-]+", "-", topic).strip("-")[:55] or "educational-short"
          stamp = datetime.now(timezone.utc).strftime("%Y%m%d-%H%M%S")
          video_number = os.environ.get("VIDEO_NUMBER", "0000")
          destination = Path("videos") / f"video-{video_number}-{stamp}-{safe_topic}.mp4"
          destination.parent.mkdir(parents=True, exist_ok=True)
          shutil.copy2(source, destination)
          print(f"Repository video ready: {destination} ({size} bytes)")
          PY

      - name: Commit video to repository
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos/*.mp4
          git commit -m "Add completed Kaggle educational Short"
          pushed=false
          for attempt in 1 2 3 4 5; do
            git fetch origin "$GITHUB_REF_NAME"
            if ! git rebase "origin/$GITHUB_REF_NAME"; then
              git rebase --abort || true
              echo "Could not rebase the finished video commit onto the latest branch."
              exit 1
            fi
            if git push; then pushed=true; break; fi
          done
          if [ "$pushed" != true ]; then
            echo "Could not push the finished video after 5 attempts."
            exit 1
          fi
          echo "Video committed to the repository."

      - name: Update Telegram after video is saved
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ inputs.chat_id || secrets.TELEGRAM_CHAT_ID }}
          PROGRESS_MESSAGE_ID: ${{ steps.progress_start.outputs.message_id }}
          VIDEO_NUMBER: ${{ steps.video_identity.outputs.number }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          token, chat, mid = os.environ['TELEGRAM_BOT_TOKEN'], os.environ['TELEGRAM_CHAT_ID'], int(os.environ['PROGRESS_MESSAGE_ID'])
          story=json.loads(Path('kaggle/story.json').read_text(encoding='utf-8'))
          text = '🎬 VIDEO #' + os.environ['VIDEO_NUMBER'] + '\nSection: ' + story.get('section','General') + '\nTopic: ' + story.get('topic','') + '\n\n✅ Story generated and checked\n✅ Kaggle rendering finished\n✅ Final MP4 downloaded and saved to the repository\n🟡 Starting YouTube upload\n\nThe YouTube workflow will send its result separately.'
          req = urllib.request.Request(f'https://api.telegram.org/bot{token}/editMessageText', data=json.dumps({'chat_id':chat,'message_id':mid,'text':text}).encode(), headers={'Content-Type':'application/json'}, method='POST')
          urllib.request.urlopen(req, timeout=20).read()
          PY

      - name: Start YouTube upload workflow
        env:
          VIDEO_GITHUB_TOKEN: ${{ secrets.VIDEO_GITHUB_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ inputs.chat_id || secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          VIDEO_TITLE="$(python -c 'import json; print(json.load(open("kaggle/story.json", encoding="utf-8")).get("title", "AI Educational Short"))')"
          VIDEO_TITLE="[VIDEO #${{ steps.video_identity.outputs.number }}] $VIDEO_TITLE"
          export VIDEO_TITLE
          python - <<'PY'
          import json, os, urllib.request
          payload = {
              "ref": "jee-telegram-quiz",
              "inputs": {
                  "source": "repository",
                  "privacy_status": "public",
                  "chat_id": os.environ["TELEGRAM_CHAT_ID"],
                  "title": os.environ["VIDEO_TITLE"]
              }
          }
          request = urllib.request.Request(
              "https://api.github.com/repos/echo-kernel/Shorts-pipeline/actions/workflows/upload-youtube.yml/dispatches",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + os.environ["VIDEO_GITHUB_TOKEN"],
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json"
              },
              method="POST"
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status not in (201, 204):
                  raise SystemExit("Could not dispatch YouTube workflow: HTTP " + str(response.status))
          print("YouTube upload workflow dispatched.")
          PY

      - name: Mark Telegram progress as failed
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ inputs.chat_id || secrets.TELEGRAM_CHAT_ID }}
          PROGRESS_MESSAGE_ID: ${{ steps.progress_start.outputs.message_id }}
          VIDEO_NUMBER: ${{ steps.video_identity.outputs.number }}
          TRACK_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          token, chat, mid = os.getenv('TELEGRAM_BOT_TOKEN'), os.getenv('TELEGRAM_CHAT_ID'), os.getenv('PROGRESS_MESSAGE_ID')
          if token and chat and mid:
              number = os.getenv('VIDEO_NUMBER', '----')
              story_path = Path('kaggle/story.json')
              try:
                  story = json.loads(story_path.read_text(encoding='utf-8')) if story_path.exists() else {}
              except Exception:
                  story = {}
              section = story.get('section', 'Not assigned yet')
              topic = story.get('topic', '')
              title = story.get('title', '')
              text = ('❌ VIDEO #' + number + ' — PROCESS FAILED\n'
                      + 'Section: ' + section + '\n'
                      + ('Title: ' + title + '\n' if title else '')
                      + ('Topic: ' + topic + '\n' if topic else '')
                      + '\nA workflow step failed. Tap Track Video Progress to open the failed step and logs.')
              markup = {'inline_keyboard': [[{'text': '📊 Track Video Progress', 'url': os.environ['TRACK_URL']}]]}
              payload = {'chat_id': chat, 'message_id': int(mid), 'text': text, 'reply_markup': markup}
              req = urllib.request.Request(f'https://api.telegram.org/bot{token}/editMessageText', data=json.dumps(payload).encode(), headers={'Content-Type':'application/json'}, method='POST')
              try: urllib.request.urlopen(req, timeout=20).read()
              except Exception as exc: print('Telegram update warning:', type(exc).__name__, str(exc)[:160])
          PY

      - name: Notify Telegram if submission workflow fails
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ inputs.chat_id || secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import requests
          token = os.getenv("TELEGRAM_BOT_TOKEN")
          chat = os.getenv("TELEGRAM_CHAT_ID")
          if token and chat:
              try:
                  requests.post(
                      f"https://api.telegram.org/bot{token}/sendMessage",
                      data={"chat_id": chat, "text": "⚠️ AI Explainer Shorts generation or video recovery failed. The workflow checked Kaggle logs and attempted to recover any saved MP4. Open GitHub Actions for the exact error."},
                      timeout=20
                  ).raise_for_status()
              except Exception as exc:
                  print("Telegram failure notification failed:", type(exc).__name__, str(exc))
          PY
