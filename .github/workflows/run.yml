
name: Submit AI Shorts to Kaggle

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Historical video topic"
        required: true
        default: "U Tirot Sing - Khasi Resistance"

permissions:
  contents: read

jobs:
  submit-kaggle:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install kaggle six
          python -c "import kaggle, six; print('Kaggle CLI and six ready')"

      - name: Validate Kaggle files
        run: |
          set -e
          test -f kaggle/kernel-metadata.json
          test -f kaggle/kaggle_runner.py
          echo "Kaggle files found."

      - name: Validate Kaggle credentials
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$KAGGLE_USERNAME" ] || [ -z "$KAGGLE_KEY" ]; then
            echo "ERROR: Kaggle credentials are missing."
            exit 1
          fi

          echo "Kaggle credentials are configured."

      - name: Submit GPU kernel to Kaggle
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          set -euo pipefail

          kaggle kernels push -p kaggle

          echo "Kaggle submission completed."
          echo "Kernel: https://www.kaggle.com/code/${KAGGLE_USERNAME}/shorts-pipeline-wan"

      - name: Report submission result
        if: always()
        run: |
          echo "GitHub Actions submission workflow finished."
          
