name: Upload Previous Short to YouTube

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "GitHub Actions run containing the generated MP4"
        required: true
        type: string
      privacy_status:
        description: "YouTube visibility"
        required: true
        type: choice
        options:
          - public
          - private
      chat_id:
        description: "Telegram chat to notify"
        required: true
        type: string
      title:
        description: "Video title"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Download the selected generated video
        uses: actions/download-artifact@v4
        with:
          name: historical-short-mp4
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.VIDEO_GITHUB_TOKEN }}
          path: youtube-upload

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install YouTube upload dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-httplib2

      - name: Upload video to YouTube
        id: youtube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          VIDEO_TITLE: ${{ inputs.title }}
          PRIVACY_STATUS: ${{ inputs.privacy_status }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          required = ["YOUTUBE_CLIENT_ID", "YOUTUBE_CLIENT_SECRET", "YOUTUBE_REFRESH_TOKEN"]
          missing = [key for key in required if not os.getenv(key)]
          if missing:
              raise SystemExit("Missing YouTube connection secrets: " + ", ".join(missing))

          videos = list(Path("youtube-upload").rglob("historical_short.mp4"))
          if not videos:
              videos = list(Path("youtube-upload").rglob("*.mp4"))
          if not videos:
              raise SystemExit("The selected saved video artifact has expired or contains no MP4.")

          video = max(videos, key=lambda p: p.stat().st_size)
          if video.stat().st_size < 10000:
              raise SystemExit("Selected MP4 is unexpectedly small.")

          privacy = os.environ["PRIVACY_STATUS"]
          if privacy not in ("public", "private"):
              raise SystemExit("Invalid privacy selection.")

          title = os.environ["VIDEO_TITLE"].strip()[:100] or "AI Educational Short"
          credentials = Credentials(
              token=None,
              refresh_token=os.environ["YOUTUBE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["YOUTUBE_CLIENT_ID"],
              client_secret=os.environ["YOUTUBE_CLIENT_SECRET"],
              scopes=["https://www.googleapis.com/auth/youtube.upload"]
          )
          credentials.refresh(Request())
          youtube = build("youtube", "v3", credentials=credentials, cache_discovery=False)

          request = youtube.videos().insert(
              part="snippet,status",
              body={
                  "snippet": {
                      "title": title,
                      "description": "AI-generated educational explainer Short.\n\nCreated with the Shorts-pipeline.",
                      "tags": ["Shorts", "Education", "Science", "Technology"],
                      "categoryId": "27"
                  },
                  "status": {
                      "privacyStatus": privacy,
                      "selfDeclaredMadeForKids": False
                  }
              },
              media_body=MediaFileUpload(
                  str(video),
                  mimetype="video/mp4",
                  chunksize=8 * 1024 * 1024,
                  resumable=True
              )
          )

          response = None
          while response is None:
              status, response = request.next_chunk()
              if status:
                  print("YouTube upload progress: {:.1f}%".format(status.progress() * 100))

          video_id = response.get("id")
          if not video_id:
              raise SystemExit("YouTube did not return a video ID.")
          output = os.environ.get("GITHUB_OUTPUT")
          if output:
              with open(output, "a", encoding="utf-8") as f:
                  f.write("video_id=" + video_id + "\n")
          print("Uploaded video ID:", video_id)
          PY

      - name: Notify Telegram
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ inputs.chat_id }}
          YOUTUBE_VIDEO_ID: ${{ steps.youtube.outputs.video_id }}
          PRIVACY_STATUS: ${{ inputs.privacy_status }}
          VIDEO_TITLE: ${{ inputs.title }}
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat = os.environ["TELEGRAM_CHAT_ID"]
          video_id = os.environ["YOUTUBE_VIDEO_ID"]
          privacy = os.environ["PRIVACY_STATUS"]
          title = os.environ["VIDEO_TITLE"]
          url = "https://youtu.be/" + video_id
          message = ("✅ YouTube upload complete!\n\n" + title +
                     "\nVisibility: " + privacy.upper() +
                     "\n" + url)
          response = requests.post(
              "https://api.telegram.org/bot" + token + "/sendMessage",
              json={"chat_id": chat, "text": message},
              timeout=20
          )
          response.raise_for_status()
          if not response.json().get("ok"):
              raise SystemExit("Telegram notification failed: " + response.text)
          PY

      - name: Notify Telegram if upload fails
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ inputs.chat_id }}
        run: |
          python - <<'PY'
          import os
          import requests
          token = os.getenv("TELEGRAM_BOT_TOKEN")
          chat = os.getenv("TELEGRAM_CHAT_ID")
          if token and chat:
              requests.post(
                  "https://api.telegram.org/bot" + token + "/sendMessage",
                  json={"chat_id": chat, "text": "❌ YouTube upload failed. Check the GitHub Actions run log. If the saved video is older than 7 days, generate it again."},
                  timeout=20
              ).raise_for_status()
          PY
