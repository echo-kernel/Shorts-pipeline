name: Deploy JEE Telegram Quiz Bot

on:
  workflow_dispatch:
  push:
    branches:
      - jee-telegram-quiz
    paths:
      - "jee-telegram-bot/**"
      - ".github/workflows/deploy-jee-telegram-bot.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the full-featured bot branch
        uses: actions/checkout@v4
        with:
          ref: jee-telegram-quiz

      - name: Validate required secrets
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN || secrets.telegram_bot_token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$TELEGRAM_TOKEN" || (echo "Missing TELEGRAM_TOKEN" && exit 1)
          test -n "$GEMINI_API_KEY" || (echo "Missing GEMINI_API_KEY" && exit 1)
          test -n "$CF_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CF_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Create or find KV namespace
        id: kv
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          LIST="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API")"
          ID="$(printf '%s' "$LIST" | jq -r '.result[]? | select(.title == "jee-telegram-quiz-state") | .id' | head -n 1)"
          if [ -z "$ID" ]; then
            CREATED="$(curl --fail --silent --show-error \
              -X POST "$API" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"title":"jee-telegram-quiz-state"}')"
            ID="$(printf '%s' "$CREATED" | jq -r '.result.id')"
          fi
          test -n "$ID" && test "$ID" != "null"
          sed -i "s/REPLACE_WITH_KV_NAMESPACE_ID/$ID/" jee-telegram-bot/wrangler.toml
          echo "KV namespace ready."

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy --config jee-telegram-bot/wrangler.toml

      - name: Configure Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN || secrets.telegram_bot_token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VIDEO_GITHUB_TOKEN: ${{ secrets.VIDEO_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          WEBHOOK_SECRET="$(openssl rand -hex 32)"
          printf '%s' "$TELEGRAM_TOKEN" | npx wrangler secret put TELEGRAM_TOKEN --config jee-telegram-bot/wrangler.toml
          printf '%s' "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY --config jee-telegram-bot/wrangler.toml
          if [ -n "$VIDEO_GITHUB_TOKEN" ]; then
            printf '%s' "$VIDEO_GITHUB_TOKEN" | npx wrangler secret put GITHUB_TOKEN --config jee-telegram-bot/wrangler.toml
            echo "Video workflow trigger secret configured."
          else
            echo "VIDEO_GITHUB_TOKEN is not set; video requests will show setup instructions."
          fi
          printf '%s' "$WEBHOOK_SECRET" | npx wrangler secret put TELEGRAM_WEBHOOK_SECRET --config jee-telegram-bot/wrangler.toml
          echo "::add-mask::$WEBHOOK_SECRET"
          echo "WEBHOOK_SECRET=$WEBHOOK_SECRET" >> "$GITHUB_ENV"

      - name: Set Telegram webhook
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN || secrets.telegram_bot_token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          SUBDOMAIN_RESPONSE="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")"
          SUBDOMAIN="$(printf '%s' "$SUBDOMAIN_RESPONSE" | jq -r '.result.subdomain // empty')"
          if [ -z "$SUBDOMAIN" ]; then
            echo "Cloudflare workers.dev subdomain is not enabled for this account yet."
            echo "Enable workers.dev in Cloudflare Workers & Pages, then rerun this workflow."
            exit 1
          fi
          WORKER_URL="https://jee-telegram-quiz.$SUBDOMAIN.workers.dev"
          echo "Registering Telegram webhook at $WORKER_URL"
          curl --fail --silent --show-error \
            -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/setWebhook" \
            --data-urlencode "url=$WORKER_URL" \
            --data-urlencode "secret_token=$WEBHOOK_SECRET"

      - name: Set Telegram command menu
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN || secrets.telegram_bot_token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/setMyCommands" \
            -H "Content-Type: application/json" \
            --data '{"commands":[
              {"command":"start","description":"Open the JEE quiz bot"},
              {"command":"quiz","description":"Start a mixed JEE PYQ quiz"},
              {"command":"physics","description":"Start a Physics quiz"},
              {"command":"chemistry","description":"Start a Chemistry quiz"},
              {"command":"maths","description":"Start a Mathematics quiz"},
              {"command":"topics","description":"Show available chapter-wise topics"},
              {"command":"topic","description":"Start a quiz for a chapter"},
              {"command":"stop","description":"Stop the current quiz"},
              {"command":"years","description":"Browse PYQs by year"},
              {"command":"fullpaper","description":"Browse complete 75-question papers"},
              {"command":"progress","description":"Show your quiz performance"},
              {"command":"mistakes","description":"Review recent wrong answers"},
              {"command":"coverage","description":"Show verified PYQ bank coverage"},
              {"command":"help","description":"Show bot instructions"}
            ]}'
